# Builds "OpenClapper Staging" (org.openclapper.staging, clay icon) for the staging instance's APP_URL,
# signed with the staging key (its upload key on Google Play): core's Build phone app workflow on core's
# main (or the branch given), with the staging environment. The APK and the App Bundle are the run's
# artifacts for 3 days; with track: internal the bundle also goes to the staging app's internal track.
name: Staging · Build phone app

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of core to build
        type: string
        default: main
      track:
        description: Also upload the bundle to this Google Play track of the staging app
        type: choice
        options: [none, internal]
        default: none

permissions:
  contents: read

jobs:
  build:
    uses: OpenClapper-dev/core/.github/workflows/build-phone-app.yml@main
    with:
      path: core
      variant: staging
      track: ${{ inputs.track || 'none' }}
      environment: staging
      ref: ${{ inputs.ref || 'main' }}
    secrets: inherit
