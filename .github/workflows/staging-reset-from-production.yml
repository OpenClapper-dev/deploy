# Replaces staging with a 1:1 copy of production (core's Clone instance: R2, then D1; sessions not
# copied), then deploys the staging server, which applies the migrations main has on top. Everything
# staging held is gone afterwards; production is only read. Type the staging database's name to
# confirm. Settings: the staging environment (SOURCE_* variables, both R2 tokens; README.md).
name: Staging · Reset from production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the staging database's name (openclapper-staging-db) to replace staging
        type: string
        required: true
      ref:
        description: Branch, tag or commit of core to run and then deploy
        type: string
        default: main

permissions:
  contents: read

jobs:
  clone:
    uses: OpenClapper-dev/core/.github/workflows/clone-instance.yml@main
    with:
      path: core
      environment: staging
      confirm: ${{ inputs.confirm }}
      ref: ${{ inputs.ref || 'main' }}
    secrets: inherit

  # Right after: the clone recreated the database, and the Workers are bound to the old one until then.
  deploy:
    needs: clone
    uses: OpenClapper-dev/core/.github/workflows/deploy-server.yml@main
    with:
      path: core
      environment: staging
      ref: ${{ inputs.ref || 'main' }}
    secrets: inherit
