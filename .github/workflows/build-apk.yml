# Builds the phone app for the reference instance: the public repository's Build APK workflow, run on
# the version the fielder/ submodule is pinned to (scripts/bump.sh keeps the refs equal). runner: the
# APK is this run's artifact for 3 days; cloud: queued on EAS, download it from expo.dev.
# Needs the EXPO_TOKEN secret and the APP_URL variable (README.md).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Where the build runs
        type: choice
        options: [runner, cloud]
        default: runner

jobs:
  build:
    uses: bubulux/fielder/.github/workflows/build-apk.yml@a78a9124d2ec4b55a3a7354d132036a8ff41065e
    with:
      path: fielder
      mode: ${{ inputs.mode }}
    secrets: inherit
