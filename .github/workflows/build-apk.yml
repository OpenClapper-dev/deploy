# Builds the phone app for the reference instance: the public repository's Build APK workflow, run on
# the version the core/ submodule is pinned to (scripts/bump.sh keeps the refs equal). expo prebuild
# + Gradle on the runner, signed with this instance's key; the APK is the run's artifact for 3 days.
# Needs the four ANDROID_KEY* secrets and the APP_URL variable (README.md); variant=dev builds the
# development client instead (no key or server needed).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: release (the app for APP_URL) or dev (the development client for Metro)
        type: choice
        options: [release, dev]
        default: release

jobs:
  build:
    uses: OpenClapper-dev/core/.github/workflows/build-apk.yml@46ece2790245247bd96ad3eac7bae47f92238a01
    with:
      path: core
      environment: production
      variant: ${{ inputs.variant || 'release' }}
    secrets: inherit
