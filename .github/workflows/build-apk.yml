# Builds the phone app for the reference instance: the public repository's Build APK workflow, run on
# the version the fielder/ submodule is pinned to (scripts/bump.sh keeps the refs equal). expo prebuild
# + Gradle on the runner, signed with this instance's key; the APK is the run's artifact for 3 days.
# Needs the four ANDROID_KEY* secrets and the APP_URL variable (README.md).
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    uses: OpenClapper-dev/core/.github/workflows/build-apk.yml@5fa0f1208f22abaeddddcc5e90c05cc133b8d802
    with:
      path: fielder
    secrets: inherit
