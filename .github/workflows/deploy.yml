# Deploys the reference instance: the public repository's Deploy workflow, run on the version the
# core/ submodule is pinned to (scripts/bump.sh keeps the two refs equal). Manual only: the owner
# deploys. Settings are the `production` GitHub environment and the repository's shared secrets (README.md).
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: OpenClapper-dev/core/.github/workflows/deploy.yml@4fe2bcf41fbc1da8922dbae6fde5c963a3dabd3c
    with:
      path: core
      environment: production
    secrets: inherit
