# Deploys the reference instance: the public repository's Deploy workflow, run on the version the
# fielder/ submodule is pinned to (scripts/bump.sh keeps the two refs equal). Manual only: the owner
# deploys. Settings are this repository's secrets and variables (README.md).
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: bubulux/fielder/.github/workflows/deploy.yml@9b245cf02ed9ebc44df74b9e01d9a5c838e0dc27
    with:
      path: fielder
    secrets: inherit
