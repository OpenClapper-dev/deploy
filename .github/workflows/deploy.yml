# Deploys the reference instance: the public repository's Deploy workflow, run on the version the
# core/ submodule is pinned to (scripts/bump.sh keeps the two refs equal). Manual only: the owner
# deploys. Settings are this repository's secrets and variables (README.md).
name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: OpenClapper-dev/core/.github/workflows/deploy.yml@da4de677255f1b81ff49d9fa9c4e9362b2be40ce
    with:
      path: core
    secrets: inherit
